<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tank Arena - PvE & Split-Screen PvP</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; user-select: none; }
  #game-container { width: 100vw; height: 100vh; position: relative; }
  canvas { display: block; background: #1a1a1a; }

  #menu-overlay {
    position: absolute; inset: 0; background: rgba(0, 0, 0, 0.9);
    display: flex; flex-direction: column; justify-content: center;
    align-items: center; color: white; z-index: 10; text-align: center; padding: 20px;
  }
  h1 { color: #ffd700; margin-bottom: 10px; font-style: italic; text-transform: uppercase; }
  p { color: #aaa; margin-bottom: 25px; }
  .menu-btn {
    padding: 14px 28px; font-size: 1.1rem; font-weight: bold;
    background: #e10600; color: white; border: none; border-radius: 6px; cursor: pointer; margin: 8px;
    width: 260px; text-transform: uppercase; transition: 0.2s;
  }
  .menu-btn:hover { background: #ff2218; transform: scale(1.05); }

  #hud-overlay {
    position: absolute; top: 10px; left: 10px; right: 10px;
    display: flex; justify-content: space-between; pointer-events: none; z-index: 5;
    font-weight: bold; font-size: 14px; color: white; text-shadow: 1px 1px 2px #000;
  }
  .hud-box { background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 4px; border: 1px solid #444; }
</style>
</head>
<body>

<div id="game-container">
  <div id="hud-overlay">
    <div id="p1-hud" class="hud-box">P1 HP: 100</div>
    <div id="game-mode-hud" class="hud-box">MODE: PVE</div>
    <div id="p2-hud" class="hud-box" style="display:none;">P2 HP: 100</div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="menu-overlay">
    <h1>Tank Arena Battle</h1>
    <p>Select Game Mode</p>
    <button class="menu-btn" onclick="startGame('pve')">Player vs AI (PvE)</button>
    <button class="menu-btn" onclick="startGame('pvp')">2-Player Split-Screen (PvP)</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const MAP_WIDTH = 2500;
const MAP_HEIGHT = 2500;

// Tank Image Loading
const tankImg = new Image();
tankImg.src = '2839.png'; // Uses your primary working tank asset

let gameMode = 'pve'; // 'pve' or 'pvp'
let gameActive = false;
let tanks = [], bullets = [], obstacles = [];
let keys = {};

// Key Listeners
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

class Tank {
  constructor(x, y, colorTint, isPlayer, name, controls) {
    this.x = x;
    this.y = y;
    this.width = 40;
    this.height = 60;
    this.radius = 25;
    this.angle = Math.random() * Math.PI * 2;
    this.speed = 3.5;
    this.turnSpeed = 0.05;
    this.colorTint = colorTint;
    this.isPlayer = isPlayer;
    this.name = name;
    this.controls = controls; // 'p1', 'p2', or 'ai'
    this.hp = 100;
    this.reload = 0;
    this.id = Math.random();
  }

  update() {
    if (this.reload > 0) this.reload--;

    if (this.controls === 'p1') {
      if (keys['a']) this.angle -= this.turnSpeed;
      if (keys['d']) this.angle += this.turnSpeed;
      let move = 0;
      if (keys['w']) move = 1;
      if (keys['s']) move = -0.5;
      if (move !== 0) this.move(move);
      if (keys[' ']) this.shoot();
    } 
    else if (this.controls === 'p2') {
      if (keys['arrowleft']) this.angle -= this.turnSpeed;
      if (keys['arrowright']) this.angle += this.turnSpeed;
      let move = 0;
      if (keys['arrowup']) move = 1;
      if (keys['arrowdown']) move = -0.5;
      if (move !== 0) this.move(move);
      if (keys['enter']) this.shoot();
    } 
    else if (this.controls === 'ai') {
      // Basic hunting AI
      let target = tanks.find(t => t.id !== this.id);
      if (target) {
        let targetAngle = Math.atan2(target.y - this.y, target.x - this.x);
        let diff = targetAngle - this.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        this.angle += Math.sign(diff) * Math.min(Math.abs(diff), this.turnSpeed * 0.8);
        
        this.move(0.7);
        if (Math.abs(diff) < 0.4) this.shoot();
      }
    }
  }

  move(dir) {
    let nextX = this.x + Math.cos(this.angle) * this.speed * dir;
    let nextY = this.y + Math.sin(this.angle) * this.speed * dir;
    if (!checkCollision(nextX, nextY, this.radius)) {
      this.x = nextX;
      this.y = nextY;
    }
  }

  shoot() {
    if (this.reload <= 0) {
      bullets.push(new Bullet(
        this.x + Math.cos(this.angle) * 35,
        this.y + Math.sin(this.angle) * 35,
        this.angle,
        this.id
      ));
      this.reload = 35;
    }
  }

  draw(targetCtx) {
    targetCtx.save();
    targetCtx.translate(this.x, this.y);
    targetCtx.rotate(this.angle + Math.PI / 2);

    if (tankImg.complete && tankImg.naturalWidth !== 0) {
      targetCtx.drawImage(tankImg, -this.width / 2, -this.height / 2, this.width, this.height);
      // Optional overlay tint for custom look
      if (this.colorTint) {
        targetCtx.globalCompositeOperation = 'source-atop';
        targetCtx.fillStyle = this.colorTint;
        targetCtx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
      }
    } else {
      targetCtx.fillStyle = this.colorTint || '#fff';
      targetCtx.fillRect(-20, -20, 40, 40);
    }
    targetCtx.restore();

    // Health bar & label
    targetCtx.fillStyle = 'rgba(0,0,0,0.6)';
    targetCtx.fillRect(this.x - 20, this.y - 42, 40, 6);
    targetCtx.fillStyle = '#4caf50';
    targetCtx.fillRect(this.x - 20, this.y - 42, (this.hp / 100) * 40, 6);

    targetCtx.fillStyle = '#fff';
    targetCtx.font = '11px sans-serif';
    targetCtx.textAlign = 'center';
    targetCtx.fillText(this.name, this.x, this.y - 48);
  }
}

class Bullet {
  constructor(x, y, angle, ownerId) {
    this.x = x; this.y = y; this.angle = angle; this.speed = 9; this.ownerId = ownerId; this.life = 100;
  }
  update() {
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    this.life--;
  }
  draw(targetCtx) {
    targetCtx.fillStyle = '#ffeb3b';
    targetCtx.beginPath();
    targetCtx.arc(this.x, this.y, 4, 0, Math.PI * 2);
    targetCtx.fill();
  }
}

function checkCollision(x, y, radius) {
  if (x - radius < 0 || x + radius > MAP_WIDTH || y - radius < 0 || y + radius > MAP_HEIGHT) return true;
  for (let obs of obstacles) {
    if (x + radius > obs.x && x - radius < obs.x + obs.w && y + radius > obs.y && y - radius < obs.y + obs.h) return true;
  }
  return false;
}

function startGame(mode) {
  gameMode = mode;
  document.getElementById('menu-overlay').style.display = 'none';
  document.getElementById('p2-hud').style.display = mode === 'pvp' ? 'block' : 'none';
  document.getElementById('game-mode-hud').innerText = mode === 'pve' ? 'MODE: PVE' : 'MODE: SPLIT-SCREEN PvP';

  // Generate Obstacles
  obstacles = [];
  for (let i = 0; i < 30; i++) {
    obstacles.push({
      x: Math.random() * (MAP_WIDTH - 200) + 100,
      y: Math.random() * (MAP_HEIGHT - 200) + 100,
      w: 100, h: 100
    });
  }

  // Set Tanks based on mode
  if (mode === 'pve') {
    tanks = [
      new Tank(400, 400, '#ffd700', true, 'Player (Gold)', 'p1'),
      new Tank(MAP_WIDTH - 400, MAP_HEIGHT - 400, '#c0c0c0', false, 'AI Bot (Silver)', 'ai')
    ];
  } else {
    tanks = [
      new Tank(400, MAP_HEIGHT / 2, '#ffd700', true, 'Player 1 (Gold)', 'p1'),
      new Tank(MAP_WIDTH - 400, MAP_HEIGHT / 2, '#00ffff', true, 'Player 2 (Blue)', 'p2')
    ];
  }

  bullets = [];
  gameActive = true;
}

function drawWorld(targetCtx, cameraX, cameraY, viewWidth, viewHeight) {
  targetCtx.save();
  targetCtx.translate(-cameraX, -cameraY);

  // Background Grid Pattern
  targetCtx.strokeStyle = '#252525';
  targetCtx.lineWidth = 1;
  for (let x = 0; x < MAP_WIDTH; x += 100) {
    targetCtx.beginPath(); targetCtx.moveTo(x, 0); targetCtx.lineTo(x, MAP_HEIGHT); targetCtx.stroke();
  }
  for (let y = 0; y < MAP_HEIGHT; y += 100) {
    targetCtx.beginPath(); targetCtx.moveTo(0, y); targetCtx.lineTo(MAP_WIDTH, y); targetCtx.stroke();
  }

  // Map Border
  targetCtx.strokeStyle = '#e10600';
  targetCtx.lineWidth = 6;
  targetCtx.strokeRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

  // Draw Obstacles
  targetCtx.fillStyle = '#333';
  targetCtx.strokeStyle = '#555';
  targetCtx.lineWidth = 2;
  obstacles.forEach(obs => {
    targetCtx.fillRect(obs.x, obs.y, obs.w, obs.h);
    targetCtx.strokeRect(obs.x, obs.y, obs.w, obs.h);
  });

  // Draw Tanks
  tanks.forEach(tank => tank.draw(targetCtx));

  // Draw Bullets
  bullets.forEach(b => b.draw(targetCtx));

  targetCtx.restore();
}

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (gameActive) {
    // Update logic for tanks & bullets
    tanks.forEach(t => t.update());

    for (let i = bullets.length - 1; i >= 0; i--) {
      let b = bullets[i];
      b.update();
      if (checkCollision(b.x, b.y, 2) || b.life <= 0) {
        bullets.splice(i, 1);
        continue;
      }
      for (let t of tanks) {
        if (t.id !== b.ownerId && Math.hypot(t.x - b.x, t.y - b.y) < t.radius) {
          t.hp -= 25;
          bullets.splice(i, 1);
          if (t.hp <= 0) {
            alert(t.name + " Destroyed! Restarting Match.");
            document.getElementById('menu-overlay').style.display = 'flex';
            gameActive = false;
          }
          break;
        }
      }
    }

    // HUD Update
    if (gameMode === 'pve') {
      document.getElementById('p1-hud').innerText = `Player HP: ${Math.max(0, tanks[0].hp)}`;
    } else {
      document.getElementById('p1-hud').innerText = `P1 HP: ${Math.max(0, tanks[0].hp)}`;
      document.getElementById('p2-hud').innerText = `P2 HP: ${Math.max(0, tanks[1].hp)}`;
    }

    // Render Viewports
    if (gameMode === 'pve') {
      // Full screen view centered on Player 1
      let p1 = tanks[0];
      let camX = Math.max(0, Math.min(p1.x - canvas.width / 2, MAP_WIDTH - canvas.width));
      let camY = Math.max(0, Math.min(p1.y - canvas.height / 2, MAP_HEIGHT - canvas.height));
      drawWorld(ctx, camX, camY, canvas.width, canvas.height);
    } else {
      // Split-Screen PvP (Side-by-Side Viewports)
      let halfW = canvas.width / 2;

      // --- Player 1 View (Left Side) ---
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, halfW, canvas.height);
      ctx.clip();
      let p1 = tanks[0];
      let cam1X = Math.max(0, Math.min(p1.x - halfW / 2, MAP_WIDTH - halfW));
      let cam1Y = Math.max(0, Math.min(p1.y - canvas.height / 2, MAP_HEIGHT - canvas.height));
      drawWorld(ctx, cam1X, cam1Y, halfW, canvas.height);
      ctx.restore();

      // Divider Line
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(halfW, 0);
      ctx.lineTo(halfW, canvas.height);
      ctx.stroke();

      // --- Player 2 View (Right Side) ---
      ctx.save();
      ctx.beginPath();
      ctx.rect(halfW, 0, halfW, canvas.height);
      ctx.clip();
      let p2 = tanks[1];
      let cam2X = Math.max(0, Math.min(p2.x - halfW / 2, MAP_WIDTH - halfW));
      let cam2Y = Math.max(0, Math.min(p2.y - canvas.height / 2, MAP_HEIGHT - canvas.height));
      ctx.translate(halfW, 0);
      drawWorld(ctx, cam2X, cam2Y, halfW, canvas.height);
      ctx.restore();
    }
  }

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
