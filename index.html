<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tank Arena - PvE & Split-Screen PvP</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, html { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; user-select: none; }
  
  #game-container { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
  canvas { display: block; background: #1a1a1a; width: 100%; height: 100%; }

  #menu-overlay {
    position: absolute; inset: 0; background: rgba(0, 0, 0, 0.92);
    display: flex; flex-direction: column; justify-content: center;
    align-items: center; color: white; z-index: 100; text-align: center; padding: 20px;
  }
  h1 { color: #ffd700; margin-bottom: 10px; font-style: italic; text-transform: uppercase; font-size: 2.5rem; }
  p { color: #aaa; margin-bottom: 25px; font-size: 1.1rem; }
  .menu-btn {
    padding: 16px 32px; font-size: 1.2rem; font-weight: bold;
    background: #e10600; color: white; border: none; border-radius: 8px; cursor: pointer; margin: 10px;
    width: 300px; text-transform: uppercase; transition: 0.2s; box-shadow: 0 4px 15px rgba(225,6,0,0.4);
  }
  .menu-btn:hover { background: #ff2218; transform: scale(1.05); }

  #hud-overlay {
    position: absolute; top: 15px; left: 15px; right: 15px;
    display: flex; justify-content: space-between; pointer-events: none; z-index: 10;
    font-weight: bold; font-size: 15px; color: white; text-shadow: 1px 1px 3px #000;
  }
  .hud-box { background: rgba(0,0,0,0.75); padding: 8px 16px; border-radius: 6px; border: 1px solid #555; }

  /* On-Screen Mobile Controls */
  .touch-controls {
    position: absolute; bottom: 20px; left: 20px; right: 20px;
    display: flex; justify-content: space-between; align-items: flex-end;
    pointer-events: none; z-index: 10; touch-action: none; display: none;
  }
  .dpad { display: grid; grid-template-columns: repeat(3, 55px); grid-template-rows: repeat(3, 55px); gap: 6px; pointer-events: auto; }
  .ctrl-btn {
    background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.7);
    border-radius: 10px; color: white; display: flex; justify-content: center; align-items: center; font-size: 22px; cursor: pointer;
  }
  .ctrl-btn:active { background: rgba(76, 175, 80, 0.8); }
  .btn-up { grid-column: 2; grid-row: 1; }
  .btn-left { grid-column: 1; grid-row: 2; }
  .btn-right { grid-column: 3; grid-row: 2; }
  .btn-down { grid-column: 2; grid-row: 3; }
  .fire-btn {
    width: 80px; height: 80px; border-radius: 50%; background: rgba(225, 6, 0, 0.9);
    color: white; font-weight: bold; display: flex; justify-content: center;
    align-items: center; pointer-events: auto; border: 3px solid white; cursor: pointer; font-size: 16px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

<div id="game-container">
  <div id="hud-overlay">
    <div id="p1-hud" class="hud-box">P1 HP: 100</div>
    <div id="game-mode-hud" class="hud-box">MODE: PVE</div>
    <div id="p2-hud" class="hud-box" style="display:none;">P2 HP: 100</div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="touch-controls" class="touch-controls">
    <div class="dpad">
      <div class="ctrl-btn btn-up" id="t-up">▲</div>
      <div class="ctrl-btn btn-left" id="t-left">◄</div>
      <div class="ctrl-btn btn-right" id="t-right">►</div>
      <div class="ctrl-btn btn-down" id="t-down">▼</div>
    </div>
    <div class="fire-btn" id="t-fire">FIRE</div>
  </div>

  <div id="menu-overlay">
    <h1>Tank Arena Battle</h1>
    <p>Select Your Game Mode</p>
    <button class="menu-btn" onclick="startGame('pve')">Player vs AI (PvE)</button>
    <button class="menu-btn" onclick="startGame('pvp')">2-Player Split-Screen (PvP)</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const MAP_WIDTH = 2500;
const MAP_HEIGHT = 2500;

// Image loader with GitHub relative path safety fallback checks
const tankImg = new Image();
let imageLoaded = false;
tankImg.onload = () => { imageLoaded = true; };
tankImg.onerror = () => { imageLoaded = false; console.warn("Tank image asset missing or blocked. Switching to vector tank rendering."); };
tankImg.src = '2839.png';

let gameMode = 'pve'; 
let gameActive = false;
let tanks = [], bullets = [], obstacles = [];
let keys = {};

const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
if (isMobile) {
  document.getElementById('touch-controls').style.display = 'flex';
}

window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function bindTouch(id, keyName) {
  const el = document.getElementById(id);
  if(!el) return;
  const press = (e) => { e.preventDefault(); keys[keyName] = true; };
  const release = (e) => { e.preventDefault(); keys[keyName] = false; };
  el.addEventListener('touchstart', press); el.addEventListener('touchend', release);
  el.addEventListener('mousedown', press); el.addEventListener('mouseup', release);
}
bindTouch('t-up', 'w');
bindTouch('t-left', 'a');
bindTouch('t-right', 'd');
bindTouch('t-down', 's');
document.getElementById('t-fire').addEventListener('click', () => { if(tanks[0]) tanks[0].shoot(); });

class Tank {
  constructor(x, y, colorTint, isPlayer, name, controls) {
    this.x = x;
    this.y = y;
    this.width = 40;
    this.height = 60;
    this.radius = 25;
    this.angle = Math.random() * Math.PI * 2;
    this.speed = 3.5;
    this.turnSpeed = 0.05;
    this.colorTint = colorTint;
    this.isPlayer = isPlayer;
    this.name = name;
    this.controls = controls; 
    this.hp = 100;
    this.reload = 0;
    this.id = Math.random();
  }

  update() {
    if (this.reload > 0) this.reload--;

    if (this.controls === 'p1') {
      if (keys['a']) this.angle -= this.turnSpeed;
      if (keys['d']) this.angle += this.turnSpeed;
      let move = 0;
      if (keys['w']) move = 1;
      if (keys['s']) move = -0.5;
      if (move !== 0) this.move(move);
      if (keys[' ']) this.shoot();
    } 
    else if (this.controls === 'p2') {
      if (keys['arrowleft']) this.angle -= this.turnSpeed;
      if (keys['arrowright']) this.angle += this.turnSpeed;
      let move = 0;
      if (keys['arrowup']) move = 1;
      if (keys['arrowdown']) move = -0.5;
      if (move !== 0) this.move(move);
      if (keys['enter']) this.shoot();
    } 
    else if (this.controls === 'ai') {
      let target = tanks.find(t => t.id !== this.id);
      if (target) {
        let targetAngle = Math.atan2(target.y - this.y, target.x - this.x);
        let diff = targetAngle - this.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        this.angle += Math.sign(diff) * Math.min(Math.abs(diff), this.turnSpeed * 0.8);
        
        this.move(0.7);
        if (Math.abs(diff) < 0.4) this.shoot();
      }
    }
  }

  move(dir) {
    let nextX = this.x + Math.cos(this.angle) * this.speed * dir;
    let nextY = this.y + Math.sin(this.angle) * this.speed * dir;
    if (!checkCollision(nextX, nextY, this.radius)) {
      this.x = nextX;
      this.y = nextY;
    }
  }

  shoot() {
    if (this.reload <= 0) {
      bullets.push(new Bullet(
        this.x + Math.cos(this.angle) * 35,
        this.y + Math.sin(this.angle) * 35,
        this.angle,
        this.id
      ));
      this.reload = 35;
    }
  }

  draw(targetCtx) {
    targetCtx.save();
    targetCtx.translate(this.x, this.y);
    targetCtx.rotate(this.angle + Math.PI / 2);

    if (imageLoaded) {
      targetCtx.drawImage(tankImg, -this.width / 2, -this.height / 2, this.width, this.height);
    } else {
      // Guaranteed vector fallback graphic if image lookup fails on GitHub
      targetCtx.fillStyle = this.colorTint || '#fff';
      targetCtx.fillRect(-18, -25, 36, 50); 
      targetCtx.fillStyle = '#111';
      targetCtx.fillRect(-22, -20, 6, 40); 
      targetCtx.fillRect(16, -20, 6, 40);  
      targetCtx.fillStyle = '#444';
      targetCtx.fillRect(-4, -38, 8, 30);  
      targetCtx.beginPath();
      targetCtx.arc(0, 0, 12, 0, Math.PI * 2);
      targetCtx.fill();                    
    }
    targetCtx.restore();

    // Health bar & label
    targetCtx.fillStyle = 'rgba(0,0,0,0.7)';
    targetCtx.fillRect(this.x - 22, this.y - 48, 44, 7);
    targetCtx.fillStyle = '#4caf50';
    targetCtx.fillRect(this.x - 22, this.y - 48, (this.hp / 100) * 44, 7);

    targetCtx.fillStyle = '#fff';
    targetCtx.font = '12px sans-serif';
    targetCtx.textAlign = 'center';
    targetCtx.fillText(this.name, this.x, this.y - 56);
  }
}

class Bullet {
  constructor(x, y, angle, ownerId) {
    this.x = x; this.y = y; this.angle = angle; this.speed = 10; this.ownerId = ownerId; this.life = 100;
  }
  update() {
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    this.life--;
  }
  draw(targetCtx) {
    targetCtx.fillStyle = '#ffeb3b';
    targetCtx.beginPath();
    targetCtx.arc(this.x, this.y, 4, 0, Math.PI * 2);
    targetCtx.fill();
  }
}

function checkCollision(x, y, radius) {
  if (x - radius < 0 || x + radius > MAP_WIDTH || y - radius < 0 || y + radius > MAP_HEIGHT) return true;
  for (let obs of obstacles) {
    if (x + radius > obs.x && x - radius < obs.x + obs.w && y + radius > obs.y && y - radius < obs.y + obs.h) return true;
  }
  return false;
}

function startGame(mode) {
  gameMode = mode;
  document.getElementById('menu-overlay').style.display = 'none';
  document.getElementById('p2-hud').style.display = mode === 'pvp' ? 'block' : 'none';
  document.getElementById('game-mode-hud').innerText = mode === 'pve' ? 'MODE: PVE' : 'MODE: SPLIT-SCREEN PvP';

  obstacles = [];
  for (let i = 0; i < 30; i++) {
    obstacles.push({
      x: Math.random() * (MAP_WIDTH - 200) + 100,
      y: Math.random() * (MAP_HEIGHT - 200) + 100,
      w: 100, h: 100
    });
  }

  if (mode === 'pve') {
    tanks = [
      new Tank(400, 400, '#ffd700', true, 'Player (Gold)', 'p1'),
      new Tank(MAP_WIDTH - 400, MAP_HEIGHT - 400, '#c0c0c0', false, 'AI Bot (Silver)', 'ai')
    ];
  } else {
    tanks = [
      new Tank(400, MAP_HEIGHT / 2, '#ffd700', true, 'P1 (Gold)', 'p1'),
      new Tank(MAP_WIDTH - 400, MAP_HEIGHT / 2, '#00ffff', true, 'P2 (Cyan)', 'p2')
    ];
  }

  bullets = [];
  gameActive = true;
}

function drawWorld(targetCtx, cameraX, cameraY) {
  targetCtx.save();
  targetCtx.translate(-cameraX, -cameraY);

  targetCtx.strokeStyle = '#252525';
  targetCtx.lineWidth = 1;
  for (let x = 0; x < MAP_WIDTH; x += 100) {
    targetCtx.beginPath(); targetCtx.moveTo(x, 0); targetCtx.lineTo(x, MAP_HEIGHT); targetCtx.stroke();
  }
  for (let y = 0; y < MAP_HEIGHT; y += 100) {
    targetCtx.beginPath(); targetCtx.moveTo(0, y); targetCtx.lineTo(MAP_WIDTH, y); targetCtx.stroke();
  }

  targetCtx.strokeStyle = '#e10600';
  targetCtx.lineWidth = 6;
  targetCtx.strokeRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

  targetCtx.fillStyle = '#333';
  targetCtx.strokeStyle = '#555';
  targetCtx.lineWidth = 2;
  obstacles.forEach(obs => {
    targetCtx.fillRect(obs.x, obs.y, obs.w, obs.h);
    targetCtx.strokeRect(obs.x, obs.y, obs.w, obs.h);
  });

  tanks.forEach(tank => tank.draw(targetCtx));
  bullets.forEach(b => b.draw(targetCtx));

  targetCtx.restore();
}

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (gameActive) {
    tanks.forEach(t => t.update());

    for (let i = bullets.length - 1; i >= 0; i--) {
      let b = bullets[i];
      b.update();
      if (checkCollision(b.x, b.y, 2) || b.life <= 0) {
        bullets.splice(i, 1);
        continue;
      }
      for (let t of tanks) {
        if (t.id !== b.ownerId && Math.hypot(t.x - b.x, t.y - b.y) < t.radius) {
          t.hp -= 25;
          bullets.splice(i, 1);
          if (t.hp <= 0) {
            alert(t.name + " Destroyed! Match Over.");
            document.getElementById('menu-overlay').style.display = 'flex';
            gameActive = false;
          }
          break;
        }
      }
    }

    if (gameMode === 'pve') {
      document.getElementById('p1-hud').innerText = `Player HP: ${Math.max(0, tanks[0].hp)}`;
    } else {
      document.getElementById('p1-hud').innerText = `P1 HP: ${Math.max(0, tanks[0].hp)}`;
      document.getElementById('p2-hud').innerText = `P2 HP: ${Math.max(0, tanks[1].hp)}`;
    }

    if (gameMode === 'pve') {
      let p1 = tanks[0];
      let camX = Math.max(0, Math.min(p1.x - canvas.width / 2, MAP_WIDTH - canvas.width));
      let camY = Math.max(0, Math.min(p1.y - canvas.height / 2, MAP_HEIGHT - canvas.height));
      drawWorld(ctx, camX, camY);
    } else {
      let halfW = canvas.width / 2;

      // P1 View (Left)
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, halfW, canvas.height); ctx.clip();
      let p1 = tanks[0];
      let cam1X = Math.max(0, Math.min(p1.x - halfW / 2, MAP_WIDTH - halfW));
      let cam1Y = Math.max(0, Math.min(p1.y - canvas.height / 2, MAP_HEIGHT - canvas.height));
      drawWorld(ctx, cam1X, cam1Y);
      ctx.restore();

      // Split Divider Line
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(halfW, 0); ctx.lineTo(halfW, canvas.height); ctx.stroke();

      // P2 View (Right)
      ctx.save();
      ctx.beginPath(); ctx.rect(halfW, 0, halfW, canvas.height); ctx.clip();
      let p2 = tanks[1];
      let cam2X = Math.max(0, Math.min(p2.x - halfW / 2, MAP_WIDTH - halfW));
      let cam2Y = Math.max(0, Math.min(p2.y - canvas.height / 2, MAP_HEIGHT - canvas.height));
      ctx.translate(halfW, 0);
      drawWorld(ctx, cam2X, cam2Y);
      ctx.restore();
    }
  }

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
