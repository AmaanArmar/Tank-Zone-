<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Tank Battle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
        canvas {
            background-color: #2b2b2b;
            display: block;
            border: 2px solid #444;
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="ui-overlay">
        <div>Player HP: <span id="player-hp">100</span></div>
        <div>Enemy HP: <span id="enemy-hp">100</span></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // -------------------------------------------------------------
    // 1. TANK PNG IMAGE LOADER
    // -------------------------------------------------------------
    const tankImages = {
        player: new Image(),
        enemy1: new Image(),
        enemy2: new Image(),
        enemy3: new Image()
    };

    // Make sure these filenames match your GitHub repository exactly!
    tankImages.player.src = '2830.png';
    tankImages.enemy1.src = '2835.png';
    tankImages.enemy2.src = '2839.png';
    tankImages.enemy3.src = '2834.png';

    // -------------------------------------------------------------
    // 2. GAME STATE & ENTITIES
    // -------------------------------------------------------------
    const keys = {};

    const player = {
        x: 100,
        y: 300,
        width: 40,
        height: 40,
        angle: 0,
        speed: 3,
        rotationSpeed: 0.05,
        hp: 100
    };

    const aiTank = {
        x: 700,
        y: 300,
        width: 40,
        height: 40,
        angle: Math.PI,
        speed: 1.5,
        hp: 100,
        lastShootTime: 0
    };

    const bullets = [];
    const obstacles = [
        { x: 350, y: 150, width: 100, height: 100, label: 'Stone Pillar' },
        { x: 350, y: 350, width: 100, height: 100, label: 'Debris' }
    ];

    // -------------------------------------------------------------
    // 3. INPUT CONTROLS
    // -------------------------------------------------------------
    window.addEventListener('keydown', (e) => {
        keys[e.key.toLowerCase()] = true;
        if (e.key === ' ' || e.key === 'Spacebar') {
            shootBullet(player, 'player');
        }
    });

    window.addEventListener('keyup', (e) => {
        keys[e.key.toLowerCase()] = false;
    });

    // -------------------------------------------------------------
    // 4. GAME LOGIC & HELPER FUNCTIONS
    // -------------------------------------------------------------
    function shootBullet(shooter, owner) {
        const bulletSpeed = 7;
        bullets.push({
            x: shooter.x + Math.cos(shooter.angle) * 25,
            y: shooter.y + Math.sin(shooter.angle) * 25,
            vx: Math.cos(shooter.angle) * bulletSpeed,
            vy: Math.sin(shooter.angle) * bulletSpeed,
            owner: owner
        });
    }

    function checkRectCollision(rect1, rect2) {
        return (
            rect1.x - rect1.width / 2 < rect2.x + rect2.width &&
            rect1.x + rect1.width / 2 > rect2.x &&
            rect1.y - rect1.height / 2 < rect2.y + rect2.height &&
            rect1.y + rect1.height / 2 > rect2.y
        );
    }

    function update() {
        // Player Movement Controls (WASD or Arrow Keys)
        if (keys['a'] || keys['arrowleft']) {
            player.angle -= player.rotationSpeed;
        }
        if (keys['d'] || keys['arrowright']) {
            player.angle += player.rotationSpeed;
        }

        let moveX = 0;
        let moveY = 0;

        if (keys['w'] || keys['arrowup']) {
            moveX = Math.cos(player.angle) * player.speed;
            moveY = Math.sin(player.angle) * player.speed;
        }
        if (keys['s'] || keys['arrowdown']) {
            moveX = -Math.cos(player.angle) * (player.speed * 0.6);
            moveY = -Math.sin(player.angle) * (player.speed * 0.6);
        }

        // Apply movement with obstacle collision check
        player.x += moveX;
        player.y += moveY;

        obstacles.forEach(obs => {
            if (checkRectCollision(player, obs)) {
                player.x -= moveX;
                player.y -= moveY;
            }
        });

        // Basic AI Logic
        if (aiTank.hp > 0) {
            const dx = player.x - aiTank.x;
            const dy = player.y - aiTank.y;
            aiTank.angle = Math.atan2(dy, dx);

            // AI Shoot Interval (Every 1.5 seconds)
            const now = Date.now();
            if (now - aiTank.lastShootTime > 1500) {
                shootBullet(aiTank, 'ai');
                aiTank.lastShootTime = now;
            }
        }

        // Bullet Updates & Collisions
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx;
            b.y += b.vy;

            // Screen boundary collision
            if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                bullets.splice(i, 1);
                continue;
            }

            // Obstacle collision (Bullets hit stone/debris)
            let hitObstacle = false;
            obstacles.forEach(obs => {
                if (b.x > obs.x && b.x < obs.x + obs.width && b.y > obs.y && b.y < obs.y + obs.height) {
                    hitObstacle = true;
                }
            });

            if (hitObstacle) {
                bullets.splice(i, 1);
                continue;
            }

            // Player hit check
            if (b.owner === 'ai' && checkRectCollision({ x: b.x, y: b.y, width: 6, height: 6 }, player)) {
                player.hp = Math.max(0, player.hp - 10);
                document.getElementById('player-hp').innerText = player.hp;
                bullets.splice(i, 1);
                continue;
            }

            // AI hit check
            if (b.owner === 'player' && aiTank.hp > 0 && checkRectCollision({ x: b.x, y: b.y, width: 6, height: 6 }, aiTank)) {
                aiTank.hp = Math.max(0, aiTank.hp - 20);
                document.getElementById('enemy-hp').innerText = aiTank.hp;
                bullets.splice(i, 1);
                continue;
            }
        }
    }

    // -------------------------------------------------------------
    // 5. RENDERING FUNCTIONS
    // -------------------------------------------------------------
    function drawUnifiedTank(x, y, angle, imgObject, fallbackColor) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        // Draw image if loaded, fallback to colored box if loading fails
        if (imgObject && imgObject.complete && imgObject.naturalWidth !== 0) {
            ctx.drawImage(imgObject, -20, -20, 40, 40);
        } else {
            ctx.fillStyle = fallbackColor;
            ctx.fillRect(-20, -20, 40, 40);
            ctx.fillStyle = '#111';
            ctx.fillRect(0, -4, 25, 8); // Tank barrel
        }

        ctx.restore();
    }

    function render() {
        // Clear screen
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw background grid lines
        ctx.strokeStyle = '#333333';
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 40) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 40) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }

        // Draw solid stone/debris obstacles
        obstacles.forEach(obs => {
            ctx.fillStyle = '#666666';
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            ctx.strokeStyle = '#888888';
            ctx.lineWidth = 3;
            ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
        });

        // Draw Player Tank
        if (player.hp > 0) {
            drawUnifiedTank(player.x, player.y, player.angle, tankImages.player, '#4CA64C');
        }

        // Draw AI Tank
        if (aiTank.hp > 0) {
            drawUnifiedTank(aiTank.x, aiTank.y, aiTank.angle, tankImages.enemy1, '#D9534F');
        }

        // Draw Bullets
        ctx.fillStyle = '#FFD700';
        bullets.forEach(b => {
            ctx.beginPath();
            ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    // -------------------------------------------------------------
    // 6. MAIN GAME LOOP
    // -------------------------------------------------------------
    function gameLoop() {
        update();
        render();
        requestAnimationFrame(gameLoop);
    }

    // Start the game
    gameLoop();
</script>

</body>
</html>
